name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "examples/saas-retention-before-after.html"
      - "examples/executive-revenue-before-after.html"
      - "examples/sre-incident-before-after.html"
      - "examples/manufacturing-operations-before-after.html"
      - "assets/social-preview.svg"
      - "assets/social-preview.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Stage public assets
        run: |
          cp examples/saas-retention-before-after.html site/saas-retention-before-after.html
          cp examples/manufacturing-operations-before-after.html site/manufacturing-operations-before-after.html
          cp examples/sre-incident-before-after.html site/sre-incident-before-after.html
          cp examples/executive-revenue-before-after.html site/executive-revenue-before-after.html
          cp assets/social-preview.svg site/social-preview.svg
          cp assets/social-preview.png site/social-preview.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
