name: render-social-preview

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/social-preview.svg"
      - "assets/instagram-launch.svg"
      - "scripts/render-social-preview.py"
      - ".github/workflows/render-social-preview.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned render dependencies
        run: python -m pip install "CairoSVG==2.8.2" "Pillow==11.3.0"
      - name: Render PNG
        run: python scripts/render-social-preview.py
      - name: Preserve rendered PNGs
        uses: actions/upload-artifact@v4
        with:
          name: social-preview-pngs
          path: |
            assets/social-preview.png
            assets/instagram-launch.png
          if-no-files-found: error
          retention-days: 7
