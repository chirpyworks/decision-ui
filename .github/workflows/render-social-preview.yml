name: render-social-preview

on:
  push:
    branches:
      - main
      - assets/social-preview-png
    paths:
      - "assets/social-preview.svg"
      - "assets/instagram-launch.svg"
      - "scripts/render-social-preview.py"
      - ".github/workflows/render-social-preview.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned render dependencies
        run: python -m pip install "CairoSVG==2.8.2" "Pillow==11.3.0"
      - name: Render PNG
        run: python scripts/render-social-preview.py
      - name: Commit PNG when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview.png assets/instagram-launch.png
          if git diff --cached --quiet; then
            echo "PNG already current"
            exit 0
          fi
          git commit -m "chore: render social preview PNG"
          git push
